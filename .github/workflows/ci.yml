name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: "PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['^7.4']
        include:
          - php: '8.2'
            symfony: '7.4.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/http-client:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}"
          composer update --no-interaction --prefer-dist --no-progress

      - name: Lint sources
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run test suite
        run: composer test
